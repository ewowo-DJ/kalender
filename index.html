<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f111a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Onze kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
/* Layout: one column, month grid on top, the chosen day's agenda below, a floating Add button. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#161a2b; --muted:#5f6680; --line:#dde0ea;
  --accent:#3552d4; --accent-soft:#e6eafc; --task:#b5700a; --task-soft:#fbf0dc; --danger:#c3324f; --bday:#d9467a; --bday-soft:#fbe4ec; --ew:#16707f; --ew-soft:#dcf0f2; --he:#b8457a; --he-soft:#f8e1ec;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f111a; --surface:#181b27; --ink:#e8eaf3; --muted:#9aa1b9; --line:#2a2f42;
    --accent:#8197ff; --accent-soft:#232a4d; --task:#f0b44c; --task-soft:#3a2d14; --danger:#ff7a93; --bday:#ff86ad; --bday-soft:#4a1f30; --ew:#6fd0de; --ew-soft:#173b42; --he:#f59cc4; --he-soft:#4a2236;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#181b27; --ink:#e8eaf3; --muted:#9aa1b9; --line:#2a2f42;
  --accent:#8197ff; --accent-soft:#232a4d; --task:#f0b44c; --task-soft:#3a2d14; --danger:#ff7a93; --bday:#ff86ad; --bday-soft:#4a1f30; --ew:#6fd0de; --ew-soft:#173b42; --he:#f59cc4; --he-soft:#4a2236;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;height:100%}
#root{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;gap:10px}
.top .icon-btn{flex:none}
.ttl{flex:1;min-width:0;text-align:center}
.ttl h1{font:700 26px/1.15 var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{display:flex;align-items:center;justify-content:center;gap:8px;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:2px;white-space:nowrap}
.ttl .sub span{overflow:hidden;text-overflow:ellipsis}
.back-btn{flex:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:3px 10px;border-radius:20px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.pill-btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.month{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0 6px}
.day{border:0;background:transparent;border-radius:10px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums}
.day .n{width:28px;height:28px;line-height:28px;border-radius:50%;font-weight:500;font-size:14px}
.day.out .n{color:var(--muted);opacity:.5}
.day.today .n{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:600}
.day.sel .n{background:var(--accent);color:#fff;box-shadow:none}
.day:hover .n{background:var(--accent-soft)}
.day.sel:hover .n{background:var(--accent)}
.marks{display:flex;gap:3px;height:6px}
.marks i{width:6px;height:6px;border-radius:50%;display:block}
.marks i.t{border-radius:1.5px;background:var(--task)}

.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.panel-h h2{font:700 19px/1.2 var(--display);margin:0}
.panel-h span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.item .bar{width:4px;border-radius:4px;flex:none}
.item .time{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.item .time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;overflow-wrap:anywhere}
.item .meta svg{width:14px;height:14px;flex:none}
.item .meta a{color:var(--accent);text-decoration:none}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--task);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:14px;height:14px;color:#fff;opacity:0}
.check[aria-checked="true"]{background:var(--task)}
.check[aria-checked="true"] svg{opacity:1}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--task);background:var(--task-soft);padding:1px 6px;border-radius:5px;align-self:flex-start}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.group-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0}
.group-h.first{margin-top:0}

.note{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.note span{flex:1}
.note button{border:0;background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:500}
.status{font-size:12px;color:var(--muted);text-align:center}
.viewbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;box-shadow:0 4px 14px rgba(20,25,50,.06)}
.viewbar button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.viewbar button[aria-pressed="true"]{background:var(--accent);color:#fff}
.none{color:var(--muted);font-size:13px;padding:2px 2px 4px}
.group-h.is-today{color:var(--accent)}
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}
.login h1{font:700 30px/1.1 var(--display);margin:0}
.login p{color:var(--muted);margin:0;max-width:30ch}
.login .primary{height:50px;padding:0 24px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.foot{display:flex;justify-content:center;gap:8px;font-size:12px;color:var(--muted);padding-top:8px;flex-wrap:wrap}
.foot button{border:0;background:none;color:var(--accent);font-size:12px;padding:0;text-decoration:underline}
.appnav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.appnav button{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:15px}
.appnav button svg{width:18px;height:18px}
.appnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bal-l{color:var(--muted);font-size:15px}
.bal-n{font:700 38px/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bal.settled .bal-n{color:var(--muted)}
.who-t-ewoud{color:var(--ew)} .who-t-helen{color:var(--he)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12px;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.item.exp{align-items:center}
.exd{flex:none;width:40px;text-align:center;display:flex;flex-direction:column;line-height:1.1}
.exd b{font-size:18px;font-variant-numeric:tabular-nums}
.exd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.amt{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.eff{font-weight:600}
.item .eff-ewoud{color:var(--he)} .item .eff-helen{color:var(--ew)}
.item.settle{background:transparent}
.item.settle .eff{color:var(--muted)}
.hint{margin:2px 0 0;font-size:13px;color:var(--muted)}
.toolbar{display:contents}
.mny{display:contents}
.mny-l,.mny-r{display:contents}
/* ---------- Desktop ---------- */
@media (min-width:900px){
  .wrap.desk{max-width:none;padding:20px 28px 96px;gap:16px}
  .wrap.desk .toolbar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"nav top view" "filter filter filter";align-items:center;gap:12px 24px}
  .wrap.desk .appnav{grid-area:nav;display:flex;width:auto}
  .wrap.desk .appnav button{padding:0 16px}
  .wrap.desk .top{grid-area:top;justify-content:center;max-width:560px;width:100%;justify-self:center}
  .wrap.desk .viewbar{grid-area:view;position:static;width:300px;box-shadow:none}
  .wrap.desk .filter{grid-area:filter}
  .wrap.desk .toolbar:has(.appnav:only-child){display:flex}
  .wrap.desk .foot{justify-content:flex-start}

  /* month */
  .mlayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .mside{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
  .wrap.desk .month{padding:0;overflow:hidden}
  .wrap.desk .dow{gap:0;border-bottom:1px solid var(--line)}
  .wrap.desk .dow span{padding:10px 0}
  .wrap.desk .grid{gap:0}
  .wrap.desk .day{height:auto;min-height:118px;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);align-items:stretch;padding:6px;gap:3px}
  .wrap.desk .day:nth-child(7n){border-right:0}
  .wrap.desk .day .n{width:26px;height:26px;line-height:26px;font-size:13px;align-self:flex-start}
  .wrap.desk .day:hover{background:var(--accent-soft)}
  .wrap.desk .day:hover .n{background:transparent}
  .wrap.desk .day.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .wrap.desk .day.sel .n{background:var(--accent);color:#fff}
  .wrap.desk .marks{flex-direction:column;height:auto;gap:3px}
  .mchip{display:block;text-align:left;font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .mchip b{font-weight:600;font-variant-numeric:tabular-nums}
  .mchip.done{text-decoration:line-through;color:var(--muted)}
  .more{font-size:11px;color:var(--muted);text-align:left;padding-left:4px}

  /* expenses */
  .wrap.desk .mny{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
  .wrap.desk .mny-l{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
  .wrap.desk .mny-r{display:flex;flex-direction:column;gap:12px}
}


/* ---------- Time grid (phone and desktop) ---------- */
.tg-scroll{overflow:auto;max-height:calc(100vh - 230px);min-height:340px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tg-inner{position:relative}
.tg-sticky{position:sticky;top:0;z-index:4;background:var(--surface)}
.tg-corner,.tg-times{position:sticky;left:0;z-index:3;background:var(--surface)}
.tg-body{position:relative}
.nowall{position:absolute;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--danger) 55%,transparent);z-index:1;pointer-events:none}
.tg-times .nowlabel{position:absolute;right:4px;transform:translateY(-50%);background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;z-index:4;font-variant-numeric:tabular-nums}
@media (max-width:899px){
  .tg{border-radius:12px}
  .tg-dh{flex-direction:column;align-items:center;gap:0;padding:6px 2px;font-size:11px}
  .tg-dh small{display:none}
  .tg-dh b{font-size:17px}
  .tg-dh.today b{padding:2px 6px}
  .tg-times span{font-size:11px;right:5px}
  .tg-corner{font-size:11px}
  .tg-corner.sm{font-size:9px}
  .blk{padding:4px 6px;border-radius:6px}
  .blk-n{font-size:12px}
  .blk-l{font-size:11px}
  .blk-t .who{display:none}
  .chip{font-size:11px;padding:3px 5px}
  .blk.narrow .blk-l{display:none}
  .blk.narrow{padding:3px 4px}
  .blk.narrow .blk-n{font-size:11px;hyphens:manual}
}

.tg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tg-row{display:grid}
.tg-head{border-bottom:1px solid var(--line);background:var(--surface)}
.tg-corner{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);text-align:center;line-height:1.2}
.tg-corner.sm{font-size:10px;font-weight:500}
.tg-dh{border:0;border-left:1px solid var(--line);background:transparent;padding:10px 6px;display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--muted);font-size:13px}
.tg-dh b{font:700 20px/1 var(--display);color:var(--ink)}
.tg-dh:hover{background:var(--accent-soft)}
.tg-dh.today{color:var(--accent)}
.tg-dh.today b{background:var(--accent);color:#fff;border-radius:8px;padding:3px 7px}
.tg-all{border-bottom:1px solid var(--line);min-height:36px}
.tg-all.empty{min-height:0}
.tg-all.empty .tg-allcell{padding:3px}
.tg-all.empty .tg-corner{font-size:0}
.tg-allcell{border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tg-allcell.today,.tg-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:3px solid var(--c);cursor:pointer;min-width:0}
.chip span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done span{text-decoration:line-through;color:var(--muted)}
.chip em{width:8px;height:8px;border-radius:50%;flex:none}
.dot-ewoud{background:var(--ew)} .dot-helen{background:var(--he)}
.mini-check{flex:none;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--task);background:transparent;padding:0;display:grid;place-items:center}
.mini-check svg{width:10px;height:10px;color:#fff;opacity:0}
.mini-check[aria-checked="true"]{background:var(--task)}
.mini-check[aria-checked="true"] svg{opacity:1}
.tg-times div{position:relative;border-right:1px solid var(--line)}
.tg-times span{position:absolute;top:-8px;right:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);padding:0 2px}
.tg-times div:first-child span{top:3px}
.tg-col{position:relative;border-left:1px solid var(--line);cursor:copy;
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,transparent 50%,color-mix(in srgb,var(--line) 45%,transparent) 50%,color-mix(in srgb,var(--line) 45%,transparent) calc(50% + 1px),transparent calc(50% + 1px))}
.blk{position:absolute;border-radius:8px;padding:5px 8px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:4px solid var(--c);color:var(--ink);
  box-shadow:0 1px 0 color-mix(in srgb,var(--c) 30%,transparent);display:flex;flex-direction:column;gap:2px}
.blk:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.blk.te{cursor:default;background:color-mix(in srgb,var(--c) 11%,var(--surface));border-left-style:solid}
.blk-t{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--c) 75%,var(--ink));font-variant-numeric:tabular-nums}
.blk-t .who{font-size:10px;padding:1px 6px;font-style:normal}
.blk-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.blk-n{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.blk-l{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.blk.narrow .blk-t .who{display:none}
.blk.narrow .blk-n{font-size:12px}
.blk.short{flex-direction:row;align-items:center;gap:6px;padding:2px 8px}
.blk.short .blk-t .who{display:none}
.blk.short .blk-t .end{display:none}
.wrap.desk ~ .fab{right:28px;bottom:24px}
.blk.short .blk-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

.sheet-h h3 small.by{display:block;font:500 12px/1.3 var(--body);color:var(--muted);margin-top:3px}
.item.bday{border-color:color-mix(in srgb,var(--bday) 35%,var(--line));background:color-mix(in srgb,var(--bday) 6%,var(--surface))}
.cake{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bday-soft);color:var(--bday);display:grid;place-items:center}
.cake svg{width:18px;height:18px}
.bdays{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--bday) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bday) 30%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px}
.bdays>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.bdays b{color:var(--bday);font-size:13px}
.chip .ck{flex:none;display:grid;color:var(--bday)} .chip .ck svg{width:13px;height:13px}
.check-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:2px}
.field .check-row input{width:18px;height:18px;min-height:0;padding:0;flex:none;margin:0;accent-color:var(--bday)}
.tabs.kinds button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.item.anniv .cake{background:var(--bday);color:#fff}
.mchip .hrt{display:inline-grid;vertical-align:-2px;margin-right:3px;color:var(--bday)} .mchip .hrt svg{width:11px;height:11px}
.marks i.h{width:9px;height:9px;background:none;color:var(--bday);display:grid} .marks i.h svg{width:9px;height:9px}
.now-btn{flex:none;height:38px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.now-btn svg{width:16px;height:16px}
.now-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:420px){ .now-btn{padding:0 10px;font-size:13px} .now-btn svg{display:none} }
.title-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.who{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.who-ewoud{background:var(--ew-soft);color:var(--ew)}
.who-helen{background:var(--he-soft);color:var(--he)}
.who-both{background:linear-gradient(90deg,var(--ew-soft),var(--he-soft));color:var(--ink)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-weight:500;font-size:14px;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filter .cls-toggle{margin-left:auto}
.filter .cls-toggle[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.filter .cls-toggle[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.item.te{background:transparent;border-style:dashed}
.src{font-size:12px}
.who-pick button.wp-ewoud[aria-pressed="true"]{background:var(--ew-soft);color:var(--ew)}
.who-pick button.wp-helen[aria-pressed="true"]{background:var(--he-soft);color:var(--he)}
.who-pick button.wp-both[aria-pressed="true"]{background:linear-gradient(90deg,var(--ew-soft),var(--he-soft));color:var(--ink)}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));height:54px;padding:0 22px 0 18px;border-radius:27px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(30,45,120,.28)}
.fab svg{width:20px;height:20px}

.scrim{position:fixed;inset:0;background:rgba(10,12,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{font:700 20px/1.2 var(--display);margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:10px}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:-4px 0 0}
.actions{display:flex;gap:10px}
.actions .primary{flex:1;height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.actions .del{height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--danger);font-weight:600}
.actions .del.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script id="app">
(function(){
"use strict";
var S = {items:[]};
var PEOPLE = {ewoud:{name:"Ewoud", short:"E"}, helen:{name:"Helen", short:"H"}, both:{name:"Beiden", short:"E+H"}};

var COLORS = {blue:"#3552d4", green:"#2b9469", rose:"#d23f66", violet:"#8457d1", teal:"#1e8fa6"};
var MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
var MONTHS_SHORT = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function cap(t){ return t ? t.charAt(0).toUpperCase()+t.slice(1) : t; }
var DOW = ["ma","di","wo","do","vr","za","zo"];
var DOW_SHORT = ["zo","ma","di","wo","do","vr","za"];
var DOW_LONG = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function nice(s){var d=parse(s);return DOW_LONG[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];}

var TODAY = iso(new Date());
var ui = {tab:"cal", msheet:null, sel:TODAY, view:"month", past:false, who:"all", classes:true, sheet:null, err:"", armed:false};
try { var u = JSON.parse(localStorage.getItem("cal-ui")||"null"); if(u){ui.view=({day:1,week:1,month:1})[u.view]?u.view:"month"; ui.who=u.who||"all"; ui.classes=u.classes!==false; ui.tab=u.tab==="money"?"money":"cal";} } catch(e){}
ui.month = ui.sel.slice(0,7);
function saveUI(){try{localStorage.setItem("cal-ui",JSON.stringify({tab:ui.tab,view:ui.view,who:ui.who,classes:ui.classes}));}catch(e){}}
function visible(i){ if(!ui.classes && i.source==="timeedit") return false; return ui.who==="all" || i.who===ui.who || i.who==="both"; }
function byLine(o){
  var a=o.addedBy, e=o.editedBy, parts=[];
  if(a) parts.push("Toegevoegd door "+a);
  if(e && e!==a) parts.push((a?"gewijzigd":"Gewijzigd")+" door "+e);
  return parts.join(" · ");
}
function chip(w){ var p=PEOPLE[w]; if(!p) return ""; return '<span class="who who-'+w+'" title="Voor '+p.name+'">'+p.name+'</span>'; }

var ICON = {
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.4-9.3-9.2C1.5 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.6 0 5.7 3.5 4.5 6.8-1.8 4.8-9.3 9.2-9.3 9.2z"/></svg>',
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16M5 21v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/><path d="M5 16c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0"/><path d="M12 12V8M12 4.5c.6.8.6 1.6 0 2.2-.6-.6-.6-1.4 0-2.2z"/></svg>',
  tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  euro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.5A7 7 0 1 0 17.5 17.5"/><path d="M4 10h9M4 14h9"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>'
};

/* Birthdays are stored once and shown every year on the same day (29 Feb → 28 Feb in other years). */
/* Ewoud & Helen's anniversary: built into the app, shown every year on 11 September. */
var FIXED=[{id:"anniv-2023", type:"anniversary", title:"Ewoud & Helen", date:"2023-09-11", yearKnown:true, who:"both", source:"fixed"}];
function allItems(){ return S.items.concat(FIXED); }
function yearly(i){ return i.type==="birthday" || i.type==="anniversary"; }
function bdayOn(i, date){
  if(!yearly(i) || !i.date) return false;
  var md=i.date.slice(5), y=+date.slice(0,4);
  if(md==="02-29" && !((y%4===0&&y%100!==0)||y%400===0)) md="02-28";
  return date.slice(5)===md && (!i.yearKnown || date>=i.date);
}
function bdayCopy(i, date){
  var c=Object.assign({}, i); c.date=date; c.age=i.yearKnown ? (+date.slice(0,4)) - (+i.date.slice(0,4)) : null; return c;
}
function bdayTitle(i){
  if(i.type==="anniversary") return i.age>0 ? i.age+" jaar samen" : "Samen sinds vandaag";
  return "Verjaardag "+i.title+(i.age!=null&&i.age>0?" ("+i.age+")":"");
}
function itemsOn(date){
  return allItems().filter(function(i){ return visible(i) && (yearly(i) ? bdayOn(i,date) : i.date===date); })
    .map(function(i){ return yearly(i) ? bdayCopy(i,date) : i; })
    .sort(function(a,b){
    if(yearly(a)!==yearly(b)) return yearly(a)?-1:1;
    if(a.type==="anniversary"||b.type==="anniversary") return a.type==="anniversary"?-1:1;
    var ta=a.start||"99:99", tb=b.start||"99:99";
    if (ta!==tb) return ta<tb?-1:1;
    return a.type===b.type?0:(a.type==="event"?-1:1);
  });
}

/* ---------- Rendering ---------- */
function renderMonth(){
  var y=+ui.month.slice(0,4), m=+ui.month.slice(5,7)-1;
  var first=new Date(y,m,1), offset=(first.getDay()+6)%7;
  var start=new Date(y,m,1-offset);
  var cells="";
  for(var k=0;k<42;k++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+k);
    if(k===35 && d.getMonth()!==m) break;
    var s=iso(d), its=itemsOn(s), marks="";
    if(isDesk()){
      its.slice(0,4).forEach(function(i){
        marks += '<span class="mchip'+(i.type==="task"?" task":"")+(i.done?" done":"")+'" style="--c:'+evColor(i)+'">'+(i.start?'<b>'+esc(i.start)+'</b> ':'')+(i.type==="anniversary"?'<i class="hrt">'+ICON.heart+'</i> ':'')+esc(yearly(i)?bdayTitle(i):i.title)+'</span>';
      });
      if(its.length>4) marks+='<span class="more">+'+(its.length-4)+' meer</span>';
    } else
    its.slice(0,3).forEach(function(i){
      marks += i.type==="anniversary" ? '<i class="h">'+ICON.heart+'</i>' : i.type==="task" ? '<i class="t"></i>' : '<i style="background:'+evColor(i)+'"></i>';
    });
    var cls="day"+(d.getMonth()!==m?" out":"")+(s===TODAY?" today":"")+(s===ui.sel?" sel":"");
    var label=nice(s)+(its.length?", "+its.length+" item"+(its.length>1?"s":""):"");
    cells+='<button class="'+cls+'" data-act="pick" data-date="'+s+'" aria-label="'+esc(label)+'"><span class="n">'+d.getDate()+'</span><span class="marks">'+marks+'</span></button>';
  }
  return '<div class="month"><div class="dow">'+DOW.map(function(x){return "<span>"+x+"</span>";}).join("")+'</div><div class="grid">'+cells+'</div></div>';
}

function renderItem(i){
  if(i.type==="anniversary"){
    return '<div class="item bday anniv"><span class="cake">'+ICON.heart+'</span>'+
      '<div class="body"><div class="title-row"><div class="title">'+esc(bdayTitle(i))+'</div>'+chip(i.who)+'</div>'+
      '<div class="meta">Samen sinds 11 september 2023</div></div></div>';
  }
  if(i.type==="birthday"){
    return '<div class="item bday" data-act="edit" data-id="'+i.id+'" role="button" tabindex="0">'+
      '<span class="cake">'+ICON.cake+'</span>'+
      '<div class="body"><div class="title-row"><div class="title">'+esc(bdayTitle(i))+'</div>'+chip(i.who)+'</div>'+
      (i.age!=null&&i.age>0?'<div class="meta">Wordt vandaag '+i.age+' jaar</div>':'')+
      (i.notes?'<div class="meta">'+ICON.note+'<span>'+esc(i.notes)+'</span></div>':'')+
      (byLine(i)?'<div class="meta"><span class="src">'+esc(byLine(i))+'</span></div>':'')+
    '</div></div>';
  }
  var mapUrl = i.location ? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(i.location) : "";
  if(i.type==="event"){
    var te=i.source==="timeedit";
    return '<div class="item'+(te?" te":"")+'"'+(te?'':' data-act="edit" data-id="'+i.id+'" role="button" tabindex="0"')+'>'+
      '<span class="bar" style="background:'+(COLORS[i.color]||COLORS.blue)+'"></span>'+
      '<div class="time">'+(i.start?esc(i.start):"Hele dag")+(i.end?'<small>'+esc(i.end)+'</small>':'')+'</div>'+
      '<div class="body"><div class="title-row"><div class="title">'+esc(i.title)+'</div>'+chip(i.who)+'</div>'+
      (i.location?'<div class="meta">'+ICON.pin+'<a href="'+esc(mapUrl)+'" target="_blank" rel="noopener" data-stop="1">'+esc(i.location)+'</a></div>':'')+
      (i.notes?'<div class="meta">'+ICON.note+'<span>'+esc(i.notes)+'</span></div>':'')+
      (te?'<div class="meta"><span class="src">Uit TimeEdit · dagelijks bijgewerkt</span></div>':(byLine(i)?'<div class="meta"><span class="src">'+esc(byLine(i))+'</span></div>':''))+
      '</div></div>';
  }
  return '<div class="item'+(i.done?" done":"")+'" data-act="edit" data-id="'+i.id+'" role="button" tabindex="0">'+
    '<button class="check" role="checkbox" aria-checked="'+(!!i.done)+'" aria-label="'+esc(i.title)+' afvinken" data-act="toggle" data-id="'+i.id+'">'+ICON.tick+'</button>'+
    '<div class="body"><div class="title-row"><span class="tag">Taak'+(i.start?' · '+esc(i.start):'')+'</span>'+chip(i.who)+'</div><div class="title">'+esc(i.title)+'</div>'+
    (i.notes?'<div class="meta">'+ICON.note+'<span>'+esc(i.notes)+'</span></div>':'')+
    (byLine(i)?'<div class="meta"><span class="src">'+esc(byLine(i))+'</span></div>':'')+
    '</div></div>';
}

function renderDay(noHead){
  var its=itemsOn(ui.sel);
  var ev=its.filter(function(i){return i.type==="event";}).length, tk=its.length-ev;
  var count=[ev?ev+" afspra"+(ev>1?"ken":"ak"):"", tk?tk+" ta"+(tk>1?"ken":"ak"):""].filter(Boolean).join(", ");
  var h=noHead?'':'<div class="panel-h"><h2>'+(ui.sel===TODAY?"Vandaag, ":"")+esc(ui.sel===TODAY?nice(ui.sel):cap(nice(ui.sel)))+'</h2><span>'+(count||"")+'</span></div>';
  if(!its.length) return h+'<div class="empty">Niets gepland op deze dag.<br><button class="pill-btn" data-act="add">Afspraak of taak toevoegen</button></div>';
  return h+'<div class="list">'+its.map(renderItem).join("")+'</div>';
}

function sortItems(a,b){ var x=a.date+(a.start||"99:99"), y=b.date+(b.start||"99:99"); return x<y?-1:x>y?1:0; }
function groupHead(d, first){ return '<div class="group-h'+(first?" first":"")+(d===TODAY?" is-today":"")+'">'+(d===TODAY?"Vandaag · ":"")+esc(nice(d))+'</div>'; }
function weekStart(dstr){ var d=parse(dstr); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function addDays(dstr,n){ var d=parse(dstr); d.setDate(d.getDate()+n); return iso(d); }
function renderWeek(){
  var st=weekStart(ui.sel), out="";
  for(var k=0;k<7;k++){
    var d=iso(new Date(st.getFullYear(),st.getMonth(),st.getDate()+k)), its=itemsOn(d);
    out+=groupHead(d,k===0)+(its.length?'<div class="list">'+its.map(renderItem).join("")+'</div>':'<div class="none">Niets gepland</div>');
  }
  return out;
}
function weekLabel(){
  var a=weekStart(ui.sel), b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
  return a.getMonth()===b.getMonth() ? a.getDate()+"–"+b.getDate()+" "+MONTHS[a.getMonth()] : a.getDate()+" "+MONTHS_SHORT[a.getMonth()]+" – "+b.getDate()+" "+MONTHS_SHORT[b.getMonth()];
}

function renderSheet(){
  var it=ui.sheet, kind=it.type, isEv=kind==="event", isB=kind==="birthday";
  var sw=Object.keys(COLORS).map(function(c){
    return '<button type="button" style="background:'+COLORS[c]+'" aria-label="'+c+'" aria-pressed="'+(it.color===c)+'" data-act="color" data-color="'+c+'"></button>';
  }).join("");
  var NAMES={event:["Nieuwe afspraak","Afspraak wijzigen","Afspraak toevoegen"], task:["Nieuwe taak","Taak wijzigen","Taak toevoegen"], birthday:["Nieuwe verjaardag","Verjaardag wijzigen","Verjaardag toevoegen"]}[kind];
  var kinds=[["event","Afspraak"],["task","Taak"],["birthday","Verjaardag"]];
  return '<div class="scrim" data-act="scrim"><form class="sheet" id="sheet" novalidate>'+
    '<div class="sheet-h"><h3>'+(it.id?NAMES[1]:NAMES[0])+(it.id&&byLine(it)?'<small class="by">'+esc(byLine(it))+'</small>':'')+'</h3><button type="button" class="icon-btn" data-act="close" aria-label="Sluiten">'+ICON.close+'</button></div>'+
    (it.id?'':'<div class="tabs kinds" role="group" aria-label="Soort">'+kinds.map(function(k){ return '<button type="button" data-act="type" data-type="'+k[0]+'" aria-pressed="'+(kind===k[0])+'">'+k[1]+'</button>'; }).join("")+'</div>')+
    '<div class="field"><label id="l-who">'+(isB?"Voor wie is dit belangrijk?":"Voor wie?")+'</label><div class="tabs who-pick" role="radiogroup" aria-labelledby="l-who">'+
      ["ewoud","helen","both"].map(function(w){return '<button type="button" role="radio" class="wp-'+w+'" data-act="who" data-who="'+w+'" aria-checked="'+(it.who===w)+'" aria-pressed="'+(it.who===w)+'">'+PEOPLE[w].name+'</button>';}).join("")+
    '</div></div>'+
    '<div class="field"><label for="f-title">'+(isB?"Naam":"Titel")+'</label><input id="f-title" value="'+esc(it.title)+'" placeholder="'+(isB?"bv. Mama":isEv?"bv. Lunch met Sam":"bv. De bank bellen")+'" autocomplete="off"></div>'+
    '<div class="field"><label for="f-date">'+(isB?"Geboortedatum":"Datum")+'</label><input id="f-date" type="date" value="'+esc(it.date)+'">'+
      (isB?'<label class="check-row"><input type="checkbox" id="f-yk"'+(it.yearKnown===false?" checked":"")+'> Geboortejaar onbekend (dan tonen we geen leeftijd)</label>':'')+
    '</div>'+
    (isEv?
      '<div class="row"><div class="field"><label for="f-start">Begin</label><input id="f-start" type="time" value="'+esc(it.start)+'"></div><div class="field"><label for="f-end">Einde</label><input id="f-end" type="time" value="'+esc(it.end)+'"></div></div>'+
      '<div class="field"><label for="f-loc">Locatie</label><input id="f-loc" value="'+esc(it.location)+'" placeholder="Adres of plaats" autocomplete="off"></div>'+
      '<div class="field"><label>Kleur</label><div class="swatches">'+sw+'</div></div>'
    : isB ? ''
    :
      '<div class="field"><label for="f-start">Tijd (optioneel)</label><input id="f-start" type="time" value="'+esc(it.start)+'"></div>'
    )+
    '<div class="field"><label for="f-notes">'+(isB?"Notities (bv. cadeau-ideeën)":"Notities")+'</label><textarea id="f-notes" placeholder="Optioneel">'+esc(it.notes)+'</textarea></div>'+
    (isB?'<p class="hint">Komt elk jaar terug, en verschijnt een week op voorhand bij "Binnenkort jarig".</p>':'')+
    '<p class="err" role="alert">'+esc(ui.err)+'</p>'+

/* ---------- Saving (Firebase: login + live sync) ---------- */
var userName="", col=null, canWrite=true, loadState="Je kalender wordt geladen…", statusText="", authState="loading", loginErr="", userEmail="", stopSnap=null;
var queue={};
function write(id, body){

  var prev=queue[id]||Promise.resolve();
  queue[id]=prev.then(function(){ return body ? col.doc(id).set(body) : col.doc(id).delete(); })
    .then(function(){ if(statusText.indexOf("niet opgeslagen")>=0){statusText="";render();} })
    .catch(function(err){
      var c=err&&err.code;
      if(c==="permission-denied"){ canWrite=false; statusText="Dit account kan de kalender niet aanpassen."; }

}

    var c=err&&err.code||"";

function start(){

/* How much the person who paid gets back from the other one, in cents. */
function owedBy(e){

}

}

  else if(!EX.length) list='<div class="empty">Nog geen uitgaven. Tik op Toevoegen om de eerste in te voeren.</div>';
  else {
    var last="";
    EX.forEach(function(e){
      var mk=e.date.slice(0,7);
      if(mk!==last){ var d=parse(e.date); list+=(last?'</div>':'')+'<div class="group-h'+(last?"":" first")+'">'+cap(MONTHS[d.getMonth()])+' '+d.getFullYear()+'</div><div class="list">'; last=mk; }
      list+=renderExpense(e);
    });
    list+='</div>';
  }
  return '<div class="mny"><div class="mny-l">'+head+stats+'</div><div class="mny-r"><div class="panel-h"><h2>Geschiedenis</h2><span>'+EX.length+' item'+(EX.length===1?"":"s")+'</span></div>'+list+'</div></div>';
}
function renderExpense(e){
  var d=parse(e.date), o=owedBy(e), payer=PEOPLE[e.paidBy].name, ot=PEOPLE[other(e.paidBy)].name;
  var line = e.kind==="settle"
    ? payer+' betaalde '+ot+' terug'
    : payer+' betaalde · '+(e.split==="full" ? ot+' betaalt alles terug' : '50/50 gedeeld');
  var effect = e.kind==="settle" ? 'Terugbetaling' : ot+' moet '+money(o)+' terugbetalen';
  return '<div class="item exp'+(e.kind==="settle"?" settle":"")+'"'+(canWrite?' data-act="editex" data-id="'+e.id+'" role="button" tabindex="0"':'')+'>'+
    '<div class="exd"><b>'+d.getDate()+'</b><small>'+MONTHS_SHORT[d.getMonth()]+'</small></div>'+
    '<div class="body"><div class="title-row"><div class="title">'+esc(e.kind==="settle"?"Terugbetaling":e.desc)+'</div><div class="amt">'+money(e.amount)+'</div></div>'+
    '<div class="meta">'+esc(line)+'</div>'+
    (e.kind==="settle"?'':'<div class="meta eff eff-'+e.paidBy+'">'+esc(effect)+'</div>')+
    (byLine(e)?'<div class="meta"><span class="src">'+esc(byLine(e))+'</span></div>':'')+'</div></div>';
}
function renderExSheet(){
  var it=ui.msheet, isSettle=it.kind==="settle";
  var seg=function(name,val,label,cur){ return '<button type="button" data-act="exset" data-k="'+name+'" data-v="'+val+'" aria-pressed="'+(cur===val)+'" class="wp-'+val+'">'+label+'</button>'; };
  return '<div class="scrim" data-act="scrim"><form class="sheet" id="msheet" novalidate>'+
    '<div class="sheet-h"><h3>'+(it.id?(isSettle?"Terugbetaling wijzigen":"Uitgave wijzigen"):(isSettle?"Nieuwe terugbetaling":"Nieuwe uitgave"))+(it.id&&byLine(it)?'<small class="by">'+esc(byLine(it))+'</small>':'')+'</h3><button type="button" class="icon-btn" data-act="close" aria-label="Sluiten">'+ICON.close+'</button></div>'+
    (isSettle?'':'<div class="field"><label for="x-desc">Waarvoor was het?</label><input id="x-desc" value="'+esc(it.desc)+'" placeholder="bv. Boodschappen Delhaize" autocomplete="off"></div>')+
    '<div class="field"><label for="x-amt">Bedrag (€)</label><input id="x-amt" inputmode="decimal" value="'+esc(it.amountStr)+'" placeholder="0,00" autocomplete="off"></div>'+
    '<div class="field"><label>'+(isSettle?"Wie betaalde terug?":"Wie betaalde?")+'</label><div class="tabs who-pick">'+seg("paidBy","ewoud","Ewoud",it.paidBy)+seg("paidBy","helen","Helen",it.paidBy)+'</div></div>'+
    (isSettle?'':'<div class="field"><label>Hoe verdelen?</label><div class="tabs">'+seg("split","half","50/50",it.split)+seg("split","full","Alles terugbetalen",it.split)+'</div>'+
      '<p class="hint">'+esc(splitHint(it))+'</p></div>')+
    '<div class="field"><label for="x-date">Datum</label><input id="x-date" type="date" value="'+esc(it.date)+'"></div>'+
    '<p class="err" role="alert">'+esc(ui.err)+'</p>'+
    '<div class="actions">'+(it.id?'<button type="button" class="del'+(ui.armed?" armed":"")+'" data-act="delex">'+(ui.armed?"Tik nogmaals om te verwijderen":"Verwijderen")+'</button>':'')+
    '<button type="submit" class="primary">'+(it.id?"Wijzigingen opslaan":(isSettle?"Terugbetaling opslaan":"Uitgave toevoegen"))+'</button></div>'+
  '</form></div>';
}
function splitHint(it){
  if(!it.paidBy||!it.split) return "";
  var c=parseAmount(it.amountStr), o=PEOPLE[other(it.paidBy)].name;
  var share = isNaN(c) ? "" : " ("+money(it.split==="full"?c:Math.round(c/2))+")";
  return it.split==="full" ? o+" betaalt het volledige bedrag terug"+share+"." : o+" betaalt de helft terug"+share+".";
}
function readExForm(){
  var it=ui.msheet, g=function(id){var e=document.getElementById(id);return e?e.value.trim():null;};
  var v;
  if((v=g("x-desc"))!==null) it.desc=v;
  if((v=g("x-amt"))!==null) it.amountStr=v;
  if((v=g("x-date"))!==null) it.date=v||it.date;
}
function openEx(kind, src){
  var b=balance();
  ui.msheet = src ? {id:src.id, kind:src.kind||"expense", desc:src.desc||"", amountStr:amountStr(src.amount), paidBy:src.paidBy, split:src.split||"half", date:src.date, createdAt:src.createdAt, createdBy:src.createdBy, addedBy:src.addedBy||"", editedBy:src.editedBy||""}
    : kind==="settle" ? {kind:"settle", desc:"", amountStr:Math.abs(b)>=1?amountStr(Math.abs(b)):"", paidBy:b>0?"helen":b<0?"ewoud":"", split:"", date:TODAY}
    : {kind:"expense", desc:"", amountStr:"", paidBy:"", split:"", date:TODAY};
  ui.err=""; ui.armed=false; render();
  setTimeout(function(){ var t=document.getElementById(kind==="settle"?"x-amt":"x-desc"); if(t&&!src) t.focus(); },30);
}
function submitEx(){
  readExForm(); var it=ui.msheet, c=parseAmount(it.amountStr);
  if(it.kind!=="settle" && !it.desc){ ui.err="Vul in waarvoor het was."; render(); return; }
  if(isNaN(c)||c<=0){ ui.err="Vul een bedrag in, bv. 12,50."; render(); return; }
  if(!it.paidBy){ ui.err="Kies wie betaalde."; render(); return; }
  if(it.kind!=="settle" && !it.split){ ui.err="Kies 50/50 of alles terugbetalen."; render(); return; }
  var body={kind:it.kind, desc:it.kind==="settle"?"":it.desc, amount:c, paidBy:it.paidBy, date:it.date,
    createdAt:it.createdAt||new Date().toISOString(), createdBy:it.createdBy||userEmail, addedBy:it.addedBy||userName};
  if(it.id && userName) body.editedBy=userName;
  if(it.kind!=="settle") body.split=it.split;
  var id=it.id||uid();
  var idx=EX.findIndex(function(e){return e.id===id;}), rec=Object.assign({id:id},body);
  if(idx>=0) EX[idx]=rec; else EX.unshift(rec);
  writeEx(id, body);
  ui.msheet=null; ui.armed=false; render();
}

/* ---------- Actions ---------- */
function openSheet(item){ ui.sheet=item; ui.err=""; ui.armed=false; render(); setTimeout(function(){var t=document.getElementById("f-title"); if(t&&!item.id) t.focus();},30); }
function readForm(){
  var it=ui.sheet, g=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
  it.title=g("f-title"); it.date=g("f-date")||it.date; it.start=g("f-start"); it.notes=g("f-notes");
  if(it.type==="birthday"){ var yk=document.getElementById("f-yk"); if(yk) it.yearKnown=!yk.checked; }
  if(it.type==="event"){ it.end=g("f-end"); it.location=g("f-loc"); }
}
function shift(n){
  if(ui.view==="day"){ ui.sel=addDays(ui.sel,n); ui.month=ui.sel.slice(0,7); render(); return; }
  if(ui.view==="week"){ ui.sel=addDays(ui.sel,7*n); ui.month=ui.sel.slice(0,7); render(); return; }
  shiftMonth(n);
}
function shiftMonth(n){var y=+ui.month.slice(0,4), m=+ui.month.slice(5,7)-1+n; var d=new Date(y,m,1); ui.month=d.getFullYear()+"-"+pad(d.getMonth()+1); ui.sel=(ui.month===TODAY.slice(0,7))?TODAY:iso(d); render();}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-stop]"); if(!t) return;
  if(t.hasAttribute("data-stop")) return;
  var act=t.getAttribute("data-act");
  if(act==="scrim"){ if(e.target===t){ui.sheet=null;ui.msheet=null;render();} return; }
  switch(act){
    case "login": doLogin(); break;
    case "logout": unsub(); firebase.auth().signOut(); break;
    case "goday": ui.sel=t.dataset.date; ui.month=ui.sel.slice(0,7); ui.view="day"; saveUI(); render(); break;
    case "slot":
      if(e.target!==t || !canWrite) break;
      var r=t.getBoundingClientRect(), mm=+t.dataset.lo + Math.floor(((e.clientY-r.top)/HOUR*60)/30)*30;
      var st=pad(Math.floor(mm/60))+":"+pad(mm%60), en=pad(Math.min(23,Math.floor(mm/60)+1))+":"+pad(mm%60);
      openSheet({type:"event",who:"",title:"",date:t.dataset.date,start:st,end:en,location:"",notes:"",color:"blue",done:false}); break;
    case "pick": ui.sel=t.dataset.date; if(ui.sel.slice(0,7)!==ui.month) ui.month=ui.sel.slice(0,7); render(); break;
    case "prev": shift(-1); break;
    case "next": shift(1); break;
    case "today": ui.sel=TODAY; ui.month=TODAY.slice(0,7); render(); break;
    case "view": ui.view=t.dataset.view; saveUI(); render(); break;
    case "classes": ui.classes=!ui.classes; saveUI(); render(); break;
    case "filter": ui.who=t.dataset.who; saveUI(); render(); break;
    case "add": if(!canWrite) break; openSheet({type:"event",who:"",title:"",date:ui.sel,start:"",end:"",location:"",notes:"",color:"blue",done:false}); break;
    case "edit": if(!canWrite) break; var src=S.items.find(function(i){return i.id===t.dataset.id;}); if(src){ var cp=JSON.parse(JSON.stringify(src)); if(cp.type==="birthday"&&cp.yearKnown===false) cp.date=cp.date; openSheet(cp); } break;
    case "toggle": e.stopPropagation(); if(!canWrite) break; var it=S.items.find(function(i){return i.id===t.dataset.id;}); if(it){ var c=JSON.parse(JSON.stringify(it)); c.done=!c.done; it.done=c.done; write(c.id, clean(c)); render(); } break;
    case "close": ui.sheet=null; ui.msheet=null; render(); break;
    case "tab": ui.tab=t.dataset.tab; ui.sheet=null; ui.msheet=null; saveUI(); render(); window.scrollTo(0,0); break;
    case "addex": if(canWrite) openEx("expense"); break;
    case "settle": if(canWrite) openEx("settle"); break;
    case "editex": if(!canWrite) break; var ex=EX.find(function(x){return x.id===t.dataset.id;}); if(ex) openEx(ex.kind, ex); break;
    case "exset": readExForm(); ui.msheet[t.dataset.k]=t.dataset.v; ui.err=""; render(); break;
    case "delex":
      if(!ui.armed){ readExForm(); ui.armed=true; render(); break; }
      var xid=ui.msheet.id; EX=EX.filter(function(x){return x.id!==xid;}); ui.msheet=null; ui.armed=false; writeEx(xid,null); render(); break;
    case "type": readForm(); ui.sheet.type=t.dataset.type; render(); break;
    case "who": readForm(); ui.sheet.who=t.dataset.who; ui.err=""; render(); break;
    case "color": readForm(); ui.sheet.color=t.dataset.color; render(); break;
    case "delete":
      if(!ui.armed){ readForm(); ui.armed=true; render(); break; }
      var did=ui.sheet.id; S.items=S.items.filter(function(i){return i.id!==did;}); ui.sheet=null; write(did, null); render(); break;
    case "clear-ex": S.items.filter(function(i){return i.example;}).forEach(function(i){ write(i.id, null); }); S.items=S.items.filter(function(i){return !i.example;}); render(); break;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&(ui.sheet||ui.msheet)){ui.sheet=null;ui.msheet=null;render();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('.item[data-act="edit"],.item[data-act="editex"]')){e.preventDefault();e.target.click();}
});
document.addEventListener("input",function(e){
  if(e.target.id==="x-amt"&&ui.msheet){ ui.msheet.amountStr=e.target.value; var h=document.querySelector("#msheet .hint"); if(h) h.textContent=splitHint(ui.msheet); }
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="msheet"){ submitEx(); return; }
  readForm(); var it=ui.sheet;
  if(!it.who){ui.err="Kies voor wie het is: Ewoud, Helen of beiden."; render(); return;}
  if(!it.title){ui.err=it.type==="birthday"?"Vul de naam in.":"Geef eerst een titel op."; render(); return;}
  if(!it.date){ui.err="Kies een datum."; render(); return;}
  if(it.type==="event"&&it.start&&it.end&&it.end<it.start){ui.err="Het einde ligt voor het begin."; render(); return;}
  if(it.type==="task"){delete it.end; delete it.location; delete it.color;}
  if(it.type==="birthday"){ ["end","location","color","start","done","age"].forEach(function(k){ delete it[k]; }); it.yearKnown=it.yearKnown!==false; }
  delete it.example;
  if(!it.id){ it.id=uid(); if(userName) it.addedBy=userName; S.items.push(it); }
  else { if(userName) it.editedBy=userName; S.items=S.items.map(function(i){return i.id===it.id?it:i;}); }
  write(it.id, clean(it));
  if(it.type!=="birthday"){ ui.sel=it.date; ui.month=it.date.slice(0,7); } ui.sheet=null; ui.armed=false;
  if(ui.who!=="all" && it.who!==ui.who && it.who!=="both") ui.who="all";
  render();
});

render();
start();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ var t=iso(new Date()); if(t!==TODAY){ if(ui.sel===TODAY) ui.sel=t; TODAY=t; ui.month=ui.sel.slice(0,7); render(); } } });
})();
</script>
</body>
</html>
