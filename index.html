<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f111a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=localStorage.getItem("cal-theme-last");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);window.__accent=localStorage.getItem("cal-accent-last")||"";}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Onze kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
/* Layout: one column, month grid on top, the chosen day's agenda below, a floating Add button. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#161a2b; --muted:#5f6680; --line:#dde0ea;
  --accent:#3552d4; --accent-soft:#e6eafc; --task:#b5700a; --task-soft:#fbf0dc; --danger:#c3324f; --bday:#d9467a; --bday-soft:#fbe4ec; --ew:#16707f; --ew-soft:#dcf0f2; --he:#b8457a; --he-soft:#f8e1ec;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f111a; --surface:#181b27; --ink:#e8eaf3; --muted:#9aa1b9; --line:#2a2f42;
    --accent:#8197ff; --accent-soft:#232a4d; --task:#f0b44c; --task-soft:#3a2d14; --danger:#ff7a93; --bday:#ff86ad; --bday-soft:#4a1f30; --ew:#6fd0de; --ew-soft:#173b42; --he:#f59cc4; --he-soft:#4a2236;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#181b27; --ink:#e8eaf3; --muted:#9aa1b9; --line:#2a2f42;
  --accent:#8197ff; --accent-soft:#232a4d; --task:#f0b44c; --task-soft:#3a2d14; --danger:#ff7a93; --bday:#ff86ad; --bday-soft:#4a1f30; --ew:#6fd0de; --ew-soft:#173b42; --he:#f59cc4; --he-soft:#4a2236;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;height:100%}
#root{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;gap:10px}
.top .icon-btn{flex:none}
.ttl{flex:1;min-width:0;text-align:center}
.ttl h1{font:700 26px/1.15 var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{display:flex;align-items:center;justify-content:center;gap:8px;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:2px;white-space:nowrap}
.ttl .sub span{overflow:hidden;text-overflow:ellipsis}
.back-btn{flex:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:3px 10px;border-radius:20px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.pill-btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.month{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0 6px}
.day{border:0;background:transparent;border-radius:10px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums}
.day .n{width:28px;height:28px;line-height:28px;border-radius:50%;font-weight:500;font-size:14px}
.day.out .n{color:var(--muted);opacity:.5}
.day.today .n{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:600}
.day.sel .n{background:var(--accent);color:var(--on-accent,#fff);box-shadow:none}
.day:hover .n{background:var(--accent-soft)}
.day.sel:hover .n{background:var(--accent)}
.marks{display:flex;gap:3px;height:6px}
.marks i{width:6px;height:6px;border-radius:50%;display:block}
.marks i.t{border-radius:1.5px;background:var(--task)}

.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.panel-h h2{font:700 19px/1.2 var(--display);margin:0}
.panel-h span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.item .bar{width:4px;border-radius:4px;flex:none}
.item .time{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.item .time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;overflow-wrap:anywhere}
.item .meta svg{width:14px;height:14px;flex:none}
.item .meta a{color:var(--accent);text-decoration:none}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--task);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:14px;height:14px;color:#fff;opacity:0}
.check[aria-checked="true"]{background:var(--task)}
.check[aria-checked="true"] svg{opacity:1}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--task);background:var(--task-soft);padding:1px 6px;border-radius:5px;align-self:flex-start}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.group-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0}
.group-h.first{margin-top:0}

.note{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.note span{flex:1}
.note button{border:0;background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:500}
.status{font-size:12px;color:var(--muted);text-align:center}
.viewbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;box-shadow:0 4px 14px rgba(20,25,50,.06)}
.viewbar button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.viewbar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.none{color:var(--muted);font-size:13px;padding:2px 2px 4px}
.group-h.is-today{color:var(--accent)}
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}
.login h1{font:700 30px/1.1 var(--display);margin:0}
.login p{color:var(--muted);margin:0;max-width:30ch}
.login .primary{height:50px;padding:0 24px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent,#fff);font-weight:600;font-size:16px}
.foot{display:flex;justify-content:center;gap:8px;font-size:12px;color:var(--muted);padding-top:8px;flex-wrap:wrap}
.foot button{border:0;background:none;color:var(--accent);font-size:12px;padding:0;text-decoration:underline}
.appnav{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px}
.appnav .theme-btn{width:44px;padding:0}
.appnav .theme-btn{justify-content:center}
.appnav button.theme-btn svg{width:20px;height:20px;flex:none}
.appnav button{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:15px}
.appnav button svg{width:18px;height:18px}
.appnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bal-l{color:var(--muted);font-size:15px}
.bal-n{font:700 38px/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bal.settled .bal-n{color:var(--muted)}
.who-t-ewoud{color:var(--ew)} .who-t-helen{color:var(--he)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12px;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.item.exp{align-items:center}
.exd{flex:none;width:40px;text-align:center;display:flex;flex-direction:column;line-height:1.1}
.exd b{font-size:18px;font-variant-numeric:tabular-nums}
.exd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.amt{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.eff{font-weight:600}
.item .eff-ewoud{color:var(--he)} .item .eff-helen{color:var(--ew)}
.item.settle{background:transparent}
.item.settle .eff{color:var(--muted)}
.hint{margin:2px 0 0;font-size:13px;color:var(--muted)}
.toolbar{display:contents}
.mny{display:contents}
.mny-l,.mny-r{display:contents}
/* ---------- Desktop ---------- */
@media (min-width:900px){
  .wrap.desk{max-width:none;padding:20px 28px 96px;gap:16px}
  .wrap.desk .toolbar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"nav top view" "filter filter filter";align-items:center;gap:12px 24px}
  .wrap.desk .appnav{grid-area:nav;display:flex;width:auto}
  .wrap.desk .appnav button{padding:0 16px}
  .wrap.desk .appnav .theme-btn{padding:0;width:44px;justify-content:center}
  .wrap.desk .top{grid-area:top;justify-content:center;max-width:560px;width:100%;justify-self:center}
  .wrap.desk .viewbar{grid-area:view;position:static;width:300px;box-shadow:none}
  .wrap.desk .filter{grid-area:filter}
  .wrap.desk .toolbar:has(.appnav:only-child){display:flex}
  .wrap.desk .foot{justify-content:flex-start}

  /* month */
  .mlayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .mside{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
  .wrap.desk .month{padding:0;overflow:hidden}
  .wrap.desk .dow{gap:0;border-bottom:1px solid var(--line)}
  .wrap.desk .dow span{padding:10px 0}
  .wrap.desk .grid{gap:0}
  .wrap.desk .day{height:auto;min-height:118px;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);align-items:stretch;padding:6px;gap:3px}
  .wrap.desk .day:nth-child(7n){border-right:0}
  .wrap.desk .day .n{width:26px;height:26px;line-height:26px;font-size:13px;align-self:flex-start}
  .wrap.desk .day:hover{background:var(--accent-soft)}
  .wrap.desk .day:hover .n{background:transparent}
  .wrap.desk .day.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .wrap.desk .day.sel .n{background:var(--accent);color:var(--on-accent,#fff)}
  .wrap.desk .marks{flex-direction:column;height:auto;gap:3px}
  .mchip{display:block;text-align:left;font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .mchip b{font-weight:600;font-variant-numeric:tabular-nums}
  .mchip.done{text-decoration:line-through;color:var(--muted)}
  .more{font-size:11px;color:var(--muted);text-align:left;padding-left:4px}

  /* expenses */
  .wrap.desk .mny{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
  .wrap.desk .mny-l{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
  .wrap.desk .mny-r{display:flex;flex-direction:column;gap:12px}
}


/* ---------- Time grid (phone and desktop) ---------- */
.tg-scroll{overflow:auto;max-height:calc(100vh - 230px);min-height:340px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tg-inner{position:relative}
.tg-sticky{position:sticky;top:0;z-index:4;background:var(--surface)}
.tg-corner,.tg-times{position:sticky;left:0;z-index:3;background:var(--surface)}
.tg-body{position:relative}
.nowall{position:absolute;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--danger) 55%,transparent);z-index:1;pointer-events:none}
.tg-times .nowlabel{position:absolute;right:4px;transform:translateY(-50%);background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;z-index:4;font-variant-numeric:tabular-nums}
@media (max-width:899px){
  .tg{border-radius:12px}
  .tg-dh{flex-direction:column;align-items:center;gap:0;padding:6px 2px;font-size:11px}
  .tg-dh small{display:none}
  .tg-dh b{font-size:17px}
  .tg-dh.today b{padding:2px 6px}
  .tg-times span{font-size:11px;right:5px}
  .tg-corner{font-size:11px}
  .tg-corner.sm{font-size:9px}
  .blk{padding:4px 6px;border-radius:6px}
  .blk-n{font-size:12px}
  .blk-l{font-size:11px}
  .blk-t .who{display:none}
  .chip{font-size:11px;padding:3px 5px}
  .blk.narrow .blk-l{display:none}
  .blk.narrow{padding:3px 4px}
  .blk.narrow .blk-n{font-size:11px;hyphens:manual}
}

.tg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tg-row{display:grid}
.tg-head{border-bottom:1px solid var(--line);background:var(--surface)}
.tg-corner{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);text-align:center;line-height:1.2}
.tg-corner.sm{font-size:10px;font-weight:500}
.tg-dh{border:0;border-left:1px solid var(--line);background:transparent;padding:10px 6px;display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--muted);font-size:13px}
.tg-dh b{font:700 20px/1 var(--display);color:var(--ink)}
.tg-dh:hover{background:var(--accent-soft)}
.tg-dh.today{color:var(--accent)}
.tg-dh.today b{background:var(--accent);color:var(--on-accent,#fff);border-radius:8px;padding:3px 7px}
.tg-all{border-bottom:1px solid var(--line);min-height:36px}
.tg-all.empty{min-height:0}
.tg-all.empty .tg-allcell{padding:3px}
.tg-all.empty .tg-corner{font-size:0}
.tg-allcell{border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tg-allcell.today,.tg-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:3px solid var(--c);cursor:pointer;min-width:0}
.chip span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done span{text-decoration:line-through;color:var(--muted)}
.chip em{width:8px;height:8px;border-radius:50%;flex:none}
.dot-ewoud{background:var(--ew)} .dot-helen{background:var(--he)}
.mini-check{flex:none;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--task);background:transparent;padding:0;display:grid;place-items:center}
.mini-check svg{width:10px;height:10px;color:#fff;opacity:0}
.mini-check[aria-checked="true"]{background:var(--task)}
.mini-check[aria-checked="true"] svg{opacity:1}
.tg-times div{position:relative;border-right:1px solid var(--line)}
.tg-times span{position:absolute;top:-8px;right:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);padding:0 2px}
.tg-times div:first-child span{top:3px}
.tg-col{position:relative;border-left:1px solid var(--line);cursor:copy;
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,transparent 50%,color-mix(in srgb,var(--line) 45%,transparent) 50%,color-mix(in srgb,var(--line) 45%,transparent) calc(50% + 1px),transparent calc(50% + 1px))}
.blk{position:absolute;border-radius:8px;padding:5px 8px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:4px solid var(--c);color:var(--ink);
  box-shadow:0 1px 0 color-mix(in srgb,var(--c) 30%,transparent);display:flex;flex-direction:column;gap:2px}
.blk:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.blk.te{cursor:default;background:color-mix(in srgb,var(--c) 11%,var(--surface));border-left-style:solid}
.blk-t{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--c) 75%,var(--ink));font-variant-numeric:tabular-nums}
.blk-t .who{font-size:10px;padding:1px 6px;font-style:normal}
.blk-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.blk-n{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.blk-l{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.blk.narrow .blk-t .who{display:none}
.blk.narrow .blk-n{font-size:12px}
.blk.short{flex-direction:row;align-items:center;gap:6px;padding:2px 8px}
.blk.short .blk-t .who{display:none}
.blk.short .blk-t .end{display:none}
.wrap.desk ~ .fab{right:28px;bottom:24px}
.blk.short .blk-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

.sheet-h h3 small.by{display:block;font:500 12px/1.3 var(--body);color:var(--muted);margin-top:3px}
.item.bday{border-color:color-mix(in srgb,var(--bday) 35%,var(--line));background:color-mix(in srgb,var(--bday) 6%,var(--surface))}
.cake{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bday-soft);color:var(--bday);display:grid;place-items:center}
.cake svg{width:18px;height:18px}
.bdays{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--bday) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bday) 30%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px}
.bdays>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.bdays b{color:var(--bday);font-size:13px}
.chip .ck{flex:none;display:grid;color:var(--bday)} .chip .ck svg{width:13px;height:13px}
.check-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:2px}

/* Birthdays are stored once and shown every year on the same day (29 Feb → 28 Feb in other years). */
/* Ewoud & Helen's anniversary: built into the app, shown every year on 11 September. */
var FIXED=[{id:"anniv-2023", type:"anniversary", title:"Ewoud & Helen", date:"2023-09-11", yearKnown:true, who:"both", source:"fixed"}];
function allItems(){ return S.items.concat(FIXED); }
function yearly(i){ return i.type==="birthday" || i.type==="anniversary"; }
function bdayOn(i, date){
  if(!yearly(i) || !i.date) return false;
  var md=i.date.slice(5), y=+date.slice(0,4);
  if(md==="02-29" && !((y%4===0&&y%100!==0)||y%400===0)) md="02-28";
  return date.slice(5)===md && (!i.yearKnown || date>=i.date);
}
function bdayCopy(i, date){
  var c=Object.assign({}, i); c._born=i.date; c.date=date; c.age=i.yearKnown ? (+date.slice(0,4)) - (+i.date.slice(0,4)) : null; return c;
}
function bdayTitle(i){
  if(i.type==="anniversary") return i.age>0 ? i.age+" jaar samen" : "Samen sinds vandaag";
  return "Verjaardag "+i.title+(i.age!=null&&i.age>0?" ("+i.age+")":"");
}
/* Weekly repeat: same weekday from the start date, optionally until a date */
function repOn(i, date){
  if(i.repeat!=="weekly" || !i.date || date<i.date || (i.until && date>i.until)) return false;
  return Math.round((parse(date)-parse(i.date))/864e5)%7===0;
}
function repCopy(i, date){
  var c=Object.assign({}, i); c.date=date; c._series=true;
  if(i.type==="task") c.done=(i.doneDates||[]).indexOf(date)>=0;
  return c;
}
function itemsOn(date){
  return allItems().filter(function(i){ return visible(i) && (yearly(i) ? bdayOn(i,date) : i.repeat==="weekly" ? repOn(i,date) : i.date===date); })
    .map(function(i){ return yearly(i) ? bdayCopy(i,date) : i.repeat==="weekly" ? repCopy(i,date) : i; })
    .concat(typeof studyItemsOn==="function" ? studyItemsOn(date) : [])
    .sort(function(a,b){
    if(yearly(a)!==yearly(b)) return yearly(a)?-1:1;
    if(a.type==="anniversary"||b.type==="anniversary") return a.type==="anniversary"?-1:1;
    var ta=a.start||"99:99", tb=b.start||"99:99";
    if (ta!==tb) return ta<tb?-1:1;
    return a.type===b.type?0:(a.type==="event"?-1:1);
  });
}

/* ---------- Rendering ---------- */
function renderMonth(){
  var y=+ui.month.slice(0,4), m=+ui.month.slice(5,7)-1;
  var first=new Date(y,m,1), offset=(first.getDay()+6)%7;
  var start=new Date(y,m,1-offset);
  var cells="";
  for(var k=0;k<42;k++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+k);
    if(k===35 && d.getMonth()!==m) break;
    var s=iso(d), its=itemsOn(s), marks="";
    if(isDesk()){
      its.slice(0,4).forEach(function(i){
        marks += '<span class="mchip'+(i.type==="task"?" task":"")+(i.done?" done":"")+dual(i).cls+'" style="--c:'+evColor(i)+dual(i).css+'">'+(i.start?'<b>'+esc(i.start)+'</b> ':'')+(i.type==="anniversary"?'<i class="hrt">'+ICON.heart+'</i> ':'')+esc(yearly(i)?bdayTitle(i):i.title)+'</span>';
      });
      if(its.length>4) marks+='<span class="more">+'+(its.length-4)+' meer</span>';
    } else
    its.slice(0,3).forEach(function(i){
      marks += i.type==="anniversary" ? '<i class="h">'+ICON.heart+'</i>' : i.type==="task" ? '<i class="t"></i>' : '<i style="background:'+evColor(i)+'"></i>';
    });
    var cls="day"+(d.getMonth()!==m?" out":"")+(s===TODAY?" today":"")+(s===ui.sel?" sel":"");
    var label=nice(s)+(its.length?", "+its.length+" item"+(its.length>1?"s":""):"");
    cells+='<button class="'+cls+'" data-act="pick" data-date="'+s+'" aria-label="'+esc(label)+'"><span class="n">'+d.getDate()+'</span><span class="marks">'+marks+'</span></button>';
  }
  return '<div class="month"><div class="dow">'+DOW.map(function(x){return "<span>"+x+"</span>";}).join("")+'</div><div class="grid">'+cells+'</div></div>';
}

    '</div></div>';
}

/* ---------- Belgian date field: dd/mm/jjjj, with a calendar button ---------- */
function fmtBE(isoD){ if(!isoD||!/^\d{4}-\d{2}-\d{2}$/.test(isoD)) return ""; return isoD.slice(8,10)+"/"+isoD.slice(5,7)+"/"+isoD.slice(0,4); }
function parseBE(t){
  var m=String(t||"").trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/); if(!m) return "";
  var d=+m[1], mo=+m[2], y=+m[3], dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return "";
  return y+"-"+pad(mo)+"-"+pad(d);
}
function longDate(isoD){ var d=parse(isoD); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function dateField(id, label, isoVal, raw){
  var shown = raw!=null ? raw : fmtBE(isoVal), ok=parseBE(shown);
  return '<div class="field"><label for="'+id+'">'+label+'</label><div class="datef">'+
    '<input id="'+id+'" type="text" inputmode="numeric" placeholder="dd/mm/jjjj" maxlength="10" autocomplete="off" value="'+esc(shown)+'">'+
    '<button type="button" class="icon-btn" data-act="pickdate" data-for="'+id+'" aria-label="Kies op de kalender">'+ICON.cal+'</button>'+
    '<input type="date" class="native" id="'+id+'-n" value="'+esc(ok||isoVal||"")+'" tabindex="-1" aria-hidden="true">'+
    '</div><small class="date-read" id="'+id+'-r">'+(ok?esc(cap(DOW_LONG[parse(ok).getDay()])+" "+longDate(ok)):"")+'</small></div>';
}
/* read a date field: returns {iso, raw} — raw is kept when the text isn't a valid date yet */
/* 24-hour time like 09:15; accepts 915, 9.15, 9:15 */
function normTime(t){
  t=String(t||"").trim(); if(!t) return {v:"", ok:true};
  var m=t.match(/^(\d{1,2})[:.h]?(\d{2})$/); if(!m) return {v:t, ok:false};
  var h=+m[1], mi=+m[2]; if(h>23||mi>59) return {v:t, ok:false};
  return {v:pad(h)+":"+pad(mi), ok:true};
}
document.addEventListener("focusout",function(e){
  var t=e.target; if(!t.classList||!t.classList.contains("timef")) return;
  var n=normTime(t.value); if(n.ok) t.value=n.v;
});
function readDate(id){ var e=document.getElementById(id); if(!e) return null; var v=e.value.trim(), iso=parseBE(v); return {iso:iso, raw: iso?null:v}; }
document.addEventListener("input",function(e){
  var t=e.target; if(!t.closest||!t.closest(".datef")||t.type!=="text") return;
  var digits=t.value.replace(/\D/g,"");
  if(/^[\d\/]*$/.test(t.value) && e.inputType && e.inputType.indexOf("delete")<0){
    var f=digits.slice(0,2)+(digits.length>2?"/"+digits.slice(2,4):"")+(digits.length>4?"/"+digits.slice(4,8):"");
    if(digits.length===2||digits.length===4) f+="/";
    t.value=f;
  }
  var iso=parseBE(t.value), r=document.getElementById(t.id+"-r");
  if(r) r.textContent = iso ? cap(DOW_LONG[parse(iso).getDay()])+" "+longDate(iso) : (t.value.length>=10?"Geen geldige datum":"");
  var n=document.getElementById(t.id+"-n"); if(n&&iso) n.value=iso;
});
document.addEventListener("change",function(e){

var queue={};
function write(id, body){

    .then(function(){ if(statusText.indexOf("niet opgeslagen")>=0){statusText="";render();} })
    .catch(function(err){
      var c=err&&err.code;
      if(c==="permission-denied"){ canWrite=false; statusText="Dit account kan de kalender niet aanpassen."; }

}

function unsub(){ if(stopSnap){ stopSnap(); stopSnap=null; } if(typeof stopExpenses==="function") stopExpenses(); if(typeof stopTimeEdit==="function") stopTimeEdit(); if(typeof stopStudy==="function") stopStudy(); }
function doLogin(){

  });

var EX = [], exCol=null, stopEx=null, exState="loading";
var EUR = (function(){ try{ return new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR"}); }catch(e){ return {format:function(v){return "€ "+v.toFixed(2).replace(".",",");}}; } })();
function money(c){ return EUR.format((c||0)/100); }
function other(p){ return p==="ewoud"?"helen":"ewoud"; }
/* How much the person who paid gets back from the other one, in cents. */
function owedBy(e){
  if(e.kind==="settle") return e.amount;
  return e.split==="full" ? e.amount : Math.round(e.amount/2);
}
/* Positive: Helen owes Ewoud. Negative: Ewoud owes Helen. */
function balance(){
  var b=0;
  EX.forEach(function(e){ var o=owedBy(e); b += e.paidBy==="ewoud" ? o : -o; });
  return b;
}
function parseAmount(s){
  s=String(s||"").trim().replace(/\s|€/g,"");
  if(s.indexOf(",")>=0) s=s.replace(/\./g,"").replace(",",".");
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}

  }, function(err){ exState = err&&err.code==="permission-denied" ? "denied" : "error"; if(ui.tab==="money") render(); });

}

/* ---------- Studieplanning: per account, stored in Firestore settings/study-{uid} ---------- */
var ST={exams:[], prefs:null, state:"loading"}, stopSt=null, stUid="";
var ST_COLORS=["#c46a10","#8457d1","#2b9469","#d23f66","#3552d4","#16707f","#b8457a","#7a8a12"];
function stDefaults(){
  var fx=[]; for(var k=0;k<7;k++) fx.push({on:k<5, from:"09:00", to:"17:00"});
  return {mode:"auto", from:"09:00", to:"21:00", mix:"one", fixed:fx};
}
function stPrefs(){ var p=ST.prefs||{}, d=stDefaults(); return {mode:p.mode||d.mode, from:p.from||d.from, to:p.to||d.to, mix:p.mix||d.mix, fixed:(p.fixed&&p.fixed.length===7)?p.fixed:d.fixed}; }
function startStudy(user){

    var v=d.exists?d.data():{}; ST.exams=v.exams||[]; ST.prefs=v.prefs||null; ST.state="ready"; render();
  }, function(err){ ST.state = err&&err.code==="permission-denied" ? "denied" : "error"; render(); });
}
function stopStudy(){ if(stopSt){ stopSt(); stopSt=null; } ST={exams:[], prefs:null, state:"loading"}; }
function saveStudy(){
  if(!stUid || !window.firebase) return;
  firebase.firestore().doc("settings/study-"+stUid).set({exams:ST.exams, prefs:stPrefs(), name:userName||userEmail})
    .catch(function(err){ statusText = err&&err.code==="permission-denied" ? "Dit account kan de studieplanning niet opslaan." : "Je studieplanning is niet opgeslagen. Controleer je verbinding en probeer opnieuw."; render(); });
}
function myWho(){ var n=(userName||"").toLowerCase(); return (n==="ewoud"||n==="helen") ? n : ""; }
function hm(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
function fmtMins(m){ m=Math.round(m); if(m<60) return m+" min"; var h=m/60; return (Math.round(h*10)/10).toString().replace(".",",")+" u"; }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/864e5); }
function examStart(ex){ var t=mins(ex.time); return t==null ? 9*60 : t; }
function examLabel(ex){ return ex.time ? " om "+ex.time : ""; }
function parseHours(s){ s=String(s||"").trim().replace(",",".").replace(/\s*(u|uur)$/i,""); if(!/^\d+(\.\d+)?$/.test(s)) return NaN; var h=parseFloat(s); return Math.round(h*4)/4; }

/* What already fills this day for me: my events, shared events, classes, and my other exams. */
function busyOn(date, me){
  var out=[];
  allItems().forEach(function(i){
    if(i.type!=="event" || yearly(i) || mins(i.start)==null) return;
    if(me && i.who!==me && i.who!=="both") return;
    if(!(i.repeat==="weekly" ? repOn(i,date) : i.date===date)) return;
    var s=mins(i.start), e=mins(i.end); if(e==null||e<=s) e=s+60; out.push([s,e]);
  });
  ST.exams.forEach(function(ex){ if(ex.date===date){ var s=examStart(ex); out.push([s, s+180]); } });
  return out.sort(function(a,b){ return a[0]-b[0]; });
}
function windowOn(date, p){
  if(p.mode==="fixed"){ var f=p.fixed[(parse(date).getDay()+6)%7]; if(!f||!f.on) return null; return [mins(f.from), mins(f.to)]; }
  return [mins(p.from), mins(p.to)];
}
function freeOn(date, p, me){
  var w=windowOn(date,p); if(!w||w[0]==null||w[1]==null||w[1]<=w[0]) return [];
  var free=[[w[0],w[1]]];
  busyOn(date,me).forEach(function(b){
    var next=[]; free.forEach(function(f){
      if(b[1]<=f[0]||b[0]>=f[1]){ next.push(f); return; }
      if(b[0]>f[0]) next.push([f[0],b[0]]);
      if(b[1]<f[1]) next.push([b[1],f[1]]);
    }); free=next;
  });
  return free.filter(function(f){ return f[1]-f[0]>=30; });
}
/* Fill the free time with the day's study demands; mixing alternates in 1-hour pieces. */
function fillDay(free, demands, mix){
  var pieces=[], rem=demands.map(function(d){ return d.mins; });
  if(mix && demands.length>1){
    var any=true; while(any){ any=false; demands.forEach(function(d,k){ if(rem[k]>0){ var c=Math.min(60,rem[k]); pieces.push({k:k, m:c}); rem[k]-=c; if(rem[k]>0) any=true; } }); }
  } else demands.forEach(function(d,k){ pieces.push({k:k, m:rem[k]}); });
  var blocks=[], got=demands.map(function(){ return 0; }), fi=0, pos=free.length?free[0][0]:0;
  pieces.forEach(function(pc){
    var need=pc.m;
    while(need>0 && fi<free.length){
      var room=free[fi][1]-pos;
      if(room<15){ fi++; if(fi<free.length) pos=free[fi][0]; continue; }
      var take=Math.min(need, room), last=blocks[blocks.length-1];
      if(last && last.k===pc.k && last.e===pos) last.e+=take; else blocks.push({k:pc.k, s:pos, e:pos+take});
      pos+=take; need-=take; got[pc.k]+=take;
    }
  });
  return {blocks:blocks, got:got};
}
var planMemo={key:"", plan:null};
function studyPlan(){
  var p=stPrefs(), me=myWho();
  var key=JSON.stringify([ST.exams, p, S.ver||0, S.items.length, TODAY, me]);
  if(planMemo.key===key) return planMemo.plan;
  var exams=ST.exams.filter(function(e){ return e.date && e.start && e.hours>0; });
  var byDate={}, warn=[], shortBy={}, days={};
  exams.forEach(function(e){ days[e.id]=0; });
  if(exams.length){
    var first=exams.reduce(function(a,e){ return e.start<a?e.start:a; }, exams[0].start);
    var last=exams.reduce(function(a,e){ return e.date>a?e.date:a; }, exams[0].date);
    for(var d=first; d<last; d=addDays(d,1)){
      var review=exams.filter(function(e){ return addDays(e.date,-1)===d && e.start<=d; });
      var demands=[], mix=p.mix==="mix";
      if(review.length){
        review.forEach(function(e){ demands.push({ex:e, mins:Math.round(e.hours*60), review:true}); });
        mix=review.length>1;
      } else {
        var act=exams.filter(function(e){ return e.start<=d && d<addDays(e.date,-1); });
        if(!act.length) continue;
        if(!mix){
          act.sort(function(a,b){
            var ra=days[a.id]/Math.max(1,daysBetween(a.start,addDays(a.date,-1))), rb=days[b.id]/Math.max(1,daysBetween(b.start,addDays(b.date,-1)));
            return ra-rb || (a.date<b.date?-1:a.date>b.date?1:0);
          });
          act=[act[0]];
        } else act.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
        act.forEach(function(e){ demands.push({ex:e, mins:Math.round(e.hours*60)}); });
      }
      var res=fillDay(freeOn(d,p,me), demands, mix);
      byDate[d]=res.blocks.map(function(b){ var dm=demands[b.k]; return {ex:dm.ex, s:b.s, e:b.e, review:!!dm.review}; });
      demands.forEach(function(dm,k){
        if(!dm.review) days[dm.ex.id]++;
        if(d>=TODAY){
          if(dm.review && res.got[k]<dm.mins){ (shortBy[dm.ex.id]=shortBy[dm.ex.id]||{ex:dm.ex,m:0,n:0,rev:true}).rev=true; }
          else if(!dm.review && res.got[k]<dm.mins){ var o=shortBy[dm.ex.id]=shortBy[dm.ex.id]||{ex:dm.ex,m:0,n:0}; o.m+=dm.mins-res.got[k]; o.n++; }
        }
      });
    }
    Object.keys(shortBy).forEach(function(id){
      var o=shortBy[id];
      if(o.m>0) warn.push(o.ex.subject+": "+fmtMins(o.m)+" te weinig tijd, verspreid over "+o.n+" dag"+(o.n>1?"en":"")+".");
      if(o.rev) warn.push(o.ex.subject+": op de herhaaldag ("+nice(addDays(o.ex.date,-1))+") is er niet genoeg vrije tijd om "+fmtMins(o.ex.hours*60)+" te herhalen.");
    });
    exams.forEach(function(e){
      if(e.date<TODAY || p.mix==="mix") return;
      var span=daysBetween(e.start, addDays(e.date,-1));
      if(span>0 && days[e.id]===0) warn.push(e.subject+" krijgt geen eigen studiedag, alleen de herhaaldag. Begin vroeger of kies voor vakken mengen.");
    });
    var sameDay={}; exams.forEach(function(e){ if(e.date>=TODAY) (sameDay[e.date]=sameDay[e.date]||[]).push(e.subject); });
    Object.keys(sameDay).forEach(function(d){ if(sameDay[d].length>1) warn.push(sameDay[d].join(" en ")+" vallen op dezelfde dag: de herhaaldag wordt gedeeld."); });
  }
  planMemo={key:key, plan:{byDate:byDate, warn:warn}};
  return planMemo.plan;
}

    '<div class="mny-r"><div class="panel-h"><h2>Planning</h2>'+(any?'<span>vanaf vandaag</span>':'')+'</div>'+planHtml+doneHtml+'</div></div>';
}
function renderStudyApp(){
  var h='<div class="wrap'+(isDesk()?" desk":"")+'"><div class="toolbar">'+appNav()+'</div>'+renderStudy()+
    (statusText?'<div class="status">'+esc(statusText)+'</div>':'')+'</div>'+
    (ST.state==="ready"?'<button class="fab" data-act="addexam">'+ICON.plus+'<span>Examen toevoegen</span></button>':'')+
    '<button class="gear" data-act="menu" aria-label="Instellingen" aria-expanded="'+(!!ui.menu)+'">'+ICON.gear+'</button>'+renderMenu()+
    (ui.xsheet?renderExamSheet():"")+(ui.psheet?renderPrefsSheet():"")+(ui.ssheet?renderTESheet():"");
  var active=document.activeElement&&document.activeElement.id;
  document.documentElement.classList.remove("lockpage");
  document.getElementById("root").innerHTML=h;
  if(active){var el=document.getElementById(active); if(el) el.focus();}
}
function renderExamSheet(){
  var it=ui.xsheet;
  return '<div class="scrim" data-act="scrim"><form class="sheet" id="xsheet" novalidate>'+
    '<div class="sheet-h"><h3>'+(it.id?"Examen wijzigen":"Nieuw examen")+'</h3><button type="button" class="icon-btn" data-act="close" aria-label="Sluiten">'+ICON.close+'</button></div>'+
    '<div class="field"><label for="e-sub">Vak</label><input id="e-sub" value="'+esc(it.subject)+'" placeholder="bv. Statistiek" autocomplete="off"></div>'+
    '<div class="row">'+dateField("e-date","Examendatum",it.date,it._dateRaw)+
      '<div class="field"><label for="e-time">Uur (optioneel)</label><input id="e-time" class="timef" type="text" inputmode="numeric" placeholder="uu:mm" maxlength="5" autocomplete="off" value="'+esc(it.time)+'"></div></div>'+
    dateField("e-start","Begin met studeren op",it.start,it._startRaw)+
    '<div class="field"><label for="e-hours">Uren per dag voor dit vak</label><input id="e-hours" inputmode="decimal" value="'+esc(it.hoursStr)+'" placeholder="bv. 3 of 1,5" autocomplete="off"></div>'+
    '<p class="hint">De dag voor het examen herhaal je dit vak, met hetzelfde aantal uur. Na het examen komt het vak bij Voltooid.</p>'+
    '<p class="err" role="alert">'+esc(ui.err)+'</p>'+
    '<div class="actions">'+(it.id?'<button type="button" class="del'+(ui.armed?" armed":"")+'" data-act="delexam">'+(ui.armed?"Tik nogmaals om te verwijderen":"Verwijderen")+'</button>':'')+
    '<button type="submit" class="primary">'+(it.id?"Wijzigingen opslaan":"Examen toevoegen")+'</button></div>'+
  '</form></div>';
}
function readExamForm(){
  var it=ui.xsheet, g=function(id){ var e=document.getElementById(id); return e?e.value.trim():null; }, v;
  if((v=g("e-sub"))!==null) it.subject=v;
  if((v=g("e-time"))!==null) it.time=v;
  if((v=g("e-hours"))!==null) it.hoursStr=v;
  var a=readDate("e-date"); if(a){ it.date=a.iso||""; it._dateRaw=a.raw&&a.raw.length?a.raw:null; }
  var b=readDate("e-start"); if(b){ it.start=b.iso||""; it._startRaw=b.raw&&b.raw.length?b.raw:null; }
}
function openExam(src){
  if(src) ui.xsheet={id:src.id, subject:src.subject, date:src.date, time:src.time||"", start:src.start, hoursStr:String(src.hours).replace(".",","), color:src.color};
  else { var used=ST.exams.filter(function(e){ return e.date>=TODAY; }).map(function(e){ return e.color; });
    ui.xsheet={subject:"", date:"", time:"", start:TODAY, hoursStr:"", color:ST_COLORS.filter(function(c){ return used.indexOf(c)<0; })[0]||ST_COLORS[ST.exams.length%ST_COLORS.length]}; }
  ui.err=""; ui.armed=false; render();
  setTimeout(function(){ var t=document.getElementById("e-sub"); if(t&&!src) t.focus(); },30);
}
function submitExam(){
  readExamForm(); var it=ui.xsheet, h=parseHours(it.hoursStr), t=normTime(it.time);
  if(!it.subject){ ui.err="Vul het vak in."; render(); return; }
  if(!it.date||it._dateRaw){ ui.err="Vul de examendatum in als dd/mm/jjjj."; render(); return; }
  if(!t.ok){ ui.err="Vul het uur in als uu:mm, bv. 09:00, of laat het leeg."; render(); return; }
  if(!it.start||it._startRaw){ ui.err="Vul in wanneer je begint met studeren, als dd/mm/jjjj."; render(); return; }
  if(it.start>=it.date){ ui.err="Begin minstens een dag voor het examen met studeren."; render(); return; }
  if(isNaN(h)||h<=0||h>16){ ui.err="Vul in hoeveel uur per dag, bv. 3 of 1,5."; render(); return; }
  var rec={id:it.id||uid(), subject:it.subject, date:it.date, time:t.v, start:it.start, hours:h, color:it.color||ST_COLORS[0]};
  var ix=ST.exams.findIndex(function(e){ return e.id===rec.id; });
  if(ix>=0) ST.exams[ix]=rec; else ST.exams.push(rec);
  ui.xsheet=null; ui.armed=false; saveStudy(); render();
}
function renderPrefsSheet(){
  var p=ui.psheet;
  var seg=function(k,v,l){ return '<button type="button" data-act="stset" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(p[k]===v)+'">'+l+'</button>'; };
  var tf=function(id,val){ return '<input id="'+id+'" class="timef" type="text" inputmode="numeric" placeholder="uu:mm" maxlength="5" autocomplete="off" value="'+esc(val)+'">'; };
  var body = p.mode==="fixed"
    ? '<div class="field"><label>Vaste studie-uren per dag</label><div class="st-days">'+p.fixed.map(function(f,k){
        return '<div class="st-day'+(f.on?"":" off")+'"><button type="button" class="st-dtog" data-act="stday" data-k="'+k+'" aria-pressed="'+f.on+'">'+cap(DOW_LONG[(k+1)%7])+'</button>'+
          (f.on?tf("p-f"+k,f.from)+'<span>tot</span>'+tf("p-t"+k,f.to):'<em>Niet studeren</em>')+'</div>';
      }).join("")+'</div><p class="hint">Tik op een dag om hem aan of uit te zetten. Lessen en afspraken in die uren worden overgeslagen.</p></div>'
    : '<div class="field"><label>Plannen tussen</label><div class="row">'+tf("p-from",p.from)+tf("p-to",p.to)+'</div><p class="hint">Studieblokken komen rond je lessen en afspraken.</p></div>';
  return '<div class="scrim" data-act="scrim"><form class="sheet" id="psheet" novalidate>'+
    '<div class="sheet-h"><h3>Instellingen planning</h3><button type="button" class="icon-btn" data-act="close" aria-label="Sluiten">'+ICON.close+'</button></div>'+
    '<div class="field"><label>Wanneer plannen?</label><div class="tabs">'+seg("mode","auto","Automatisch")+seg("mode","fixed","Vaste uren")+'</div></div>'+
    body+
    '<div class="field"><label>Vakken per dag</label><div class="tabs">'+seg("mix","one","Eén vak per dag")+seg("mix","mix","Vakken mengen")+'</div>'+
      '<p class="hint">'+(p.mix==="mix"?"Elke dag studeer je alle vakken waarvoor je bezig bent, afgewisseld per uur.":"Elke dag één vak; de vakken wisselen elkaar af.")+'</p></div>'+
    '<p class="err" role="alert">'+esc(ui.err)+'</p>'+
    '<div class="actions"><button type="submit" class="primary">Opslaan</button></div>'+
  '</form></div>';
}
function readPrefsForm(){
  var p=ui.psheet, g=function(id){ var e=document.getElementById(id); return e?e.value.trim():null; }, v;
  if((v=g("p-from"))!==null) p.from=v; if((v=g("p-to"))!==null) p.to=v;
  p.fixed.forEach(function(f,k){ if((v=g("p-f"+k))!==null) f.from=v; if((v=g("p-t"+k))!==null) f.to=v; });
}
function openPrefs(){ ui.psheet=JSON.parse(JSON.stringify(stPrefs())); ui.err=""; render(); }
function submitPrefs(){
  readPrefsForm(); var p=ui.psheet, bad=false;
  var chk=function(a,b){ var x=normTime(a), y=normTime(b); if(!x.ok||!y.ok||!x.v||!y.v||y.v<=x.v){ bad=true; return null; } return [x.v,y.v]; };
  if(p.mode==="auto"){ var r=chk(p.from,p.to); if(r){ p.from=r[0]; p.to=r[1]; } }
  else p.fixed.forEach(function(f){ if(!f.on) return; var r=chk(f.from,f.to); if(r){ f.from=r[0]; f.to=r[1]; } });
  if(bad){ ui.err="Vul de uren in als uu:mm, en zorg dat het einde na het begin ligt."; render(); return; }
  if(p.mode==="fixed" && !p.fixed.some(function(f){ return f.on; })){ ui.err="Zet minstens één dag aan."; render(); return; }
  ST.prefs=p; ui.psheet=null; saveStudy(); render();
}

/* ---------- Actions ---------- */
function openSheet(item){ ui.sheet=item; ui.err=""; ui.armed=false; render(); setTimeout(function(){var t=document.getElementById("f-title"); if(t&&!item.id) t.focus();},30); }
function readForm(){
  var it=ui.sheet, g=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
  it.title=g("f-title"); var dd=readDate("f-date"); if(dd){ if(dd.iso) it.date=dd.iso; it._dateRaw=dd.raw; } var ts=normTime(g("f-start")); it.start=ts.v; it._timeErr=!ts.ok; it.notes=g("f-notes");
  if(it.type==="birthday"){ var yk=document.getElementById("f-yk"); if(yk) it.yearKnown=!yk.checked; }
  var un=readDate("f-until"); if(un){ it.until=un.iso||""; it._untilRaw=un.raw&&un.raw.length?un.raw:null; }
  if(it.type==="event"){ var te2=normTime(g("f-end")); it.end=te2.v; it._timeErr=it._timeErr||!te2.ok; it.location=g("f-loc"); }
}
function shift(n){
  if(ui.view==="day"){ ui.sel=addDays(ui.sel,n); ui.month=ui.sel.slice(0,7); render(); return; }
  if(ui.view==="week"){ ui.sel=addDays(ui.sel,7*n); ui.month=ui.sel.slice(0,7); render(); return; }
  shiftMonth(n);
}
function shiftMonth(n){var y=+ui.month.slice(0,4), m=+ui.month.slice(5,7)-1+n; var d=new Date(y,m,1); ui.month=d.getFullYear()+"-"+pad(d.getMonth()+1); ui.sel=(ui.month===TODAY.slice(0,7))?TODAY:iso(d); render();}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-stop]"); if(!t) return;
  if(t.hasAttribute("data-stop")) return;
  var act=t.getAttribute("data-act");
  if(act==="scrim"){ if(e.target===t){ui.sheet=null;ui.msheet=null;ui.ssheet=null;ui.xsheet=null;ui.psheet=null;render();} return; }
  switch(act){
    case "login": doLogin(); break;
    case "theme": toggleTheme(); break;
    case "menu": ui.menu=!ui.menu; render(); break;
    case "menu-close": ui.menu=false; render(); break;
    case "mode": if(curTheme()!==t.dataset.mode) toggleTheme(); break;
    case "accent": setAccent(t.dataset.c,true); render(); break;
    case "accent-reset": setAccent("",true); render(); break;
    case "bday": setBday(t.dataset.c,true); render(); break;
    case "bday-reset": setBday("",true); render(); break;
    case "logout": ui.menu=false; unsub(); themeUid=""; firebase.auth().signOut(); break;
    case "pickdate":
      var nat=document.getElementById(t.dataset.for+"-n");
      if(nat){ try{ nat.showPicker(); }catch(err){ nat.focus(); nat.click(); } } break;
    case "goday": ui.sel=t.dataset.date; ui.month=ui.sel.slice(0,7); ui.view="day"; saveUI(); render(); break;
    case "slot":
      if(e.target!==t || !canWrite) break;
      var r=t.getBoundingClientRect(), mm=+t.dataset.lo + Math.floor(((e.clientY-r.top)/(+t.dataset.hp||HOUR)*60)/30)*30;
      var st=pad(Math.floor(mm/60))+":"+pad(mm%60), en=pad(Math.min(23,Math.floor(mm/60)+1))+":"+pad(mm%60);
      openSheet({type:"event",who:"",title:"",date:t.dataset.date,start:st,end:en,location:"",notes:"",color:"blue",done:false}); break;
    case "pick": ui.sel=t.dataset.date; if(ui.sel.slice(0,7)!==ui.month) ui.month=ui.sel.slice(0,7); render(); break;
    case "prev": shift(-1); break;
    case "next": shift(1); break;
    case "today": ui.sel=TODAY; ui.month=TODAY.slice(0,7); render(); break;
    case "view": ui.view=t.dataset.view; saveUI(); render(); break;
    case "classes": ui.classes=!ui.classes; saveUI(); render(); break;
    case "filter": ui.who=t.dataset.who; saveUI(); render(); break;
    case "add": if(!canWrite) break; openSheet({type:"event",who:"",title:"",date:ui.sel,start:"",end:"",location:"",notes:"",color:"blue",done:false}); break;
    case "edit": if(!canWrite) break; var src=S.items.find(function(i){return i.id===t.dataset.id;}); if(src){ var cp=JSON.parse(JSON.stringify(src)); if(cp.type==="birthday"&&cp.yearKnown===false) cp.date=cp.date; openSheet(cp); } break;
    case "toggle": e.stopPropagation(); if(!canWrite) break; var it=S.items.find(function(i){return i.id===t.dataset.id;});
      if(it){ var c=JSON.parse(JSON.stringify(it));
        if(c.repeat==="weekly"){ var dd=t.dataset.date, list=c.doneDates||[], ix=list.indexOf(dd); if(ix>=0) list.splice(ix,1); else list.push(dd); c.doneDates=list; it.doneDates=list.slice(); }
        else { c.done=!c.done; it.done=c.done; }
        write(c.id, clean(c)); render(); } break;
    case "close": ui.sheet=null; ui.msheet=null; ui.ssheet=null; ui.xsheet=null; ui.psheet=null; render(); break;
    case "gostudy": ui.tab="study"; saveUI(); render(); window.scrollTo(0,0); break;
    case "studytog": ui.study=!ui.study; saveUI(); render(); break;
    case "addexam": openExam(null); break;
    case "editexam": var exm=ST.exams.find(function(x){return x.id===t.dataset.id;}); if(exm) openExam(exm); break;
    case "delexam":
      if(!ui.armed){ readExamForm(); ui.armed=true; render(); break; }
      var eid=ui.xsheet.id; ST.exams=ST.exams.filter(function(x){return x.id!==eid;}); ui.xsheet=null; ui.armed=false; saveStudy(); render(); break;
    case "stprefs": openPrefs(); break;
    case "stset": readPrefsForm(); ui.psheet[t.dataset.k]=t.dataset.v; ui.err=""; render(); break;
    case "stday": readPrefsForm(); var fd=ui.psheet.fixed[+t.dataset.k]; fd.on=!fd.on; render(); break;
    case "te-color": readTEForm(); setTEColor(t.dataset.k, t.dataset.c, true); render(); break;
    case "lk-tab": readTEForm(); ui.ssheet.tab=t.dataset.w; ui.err=""; render(); break;
    case "te-open": ui.menu=false; ui.ssheet={}; ui.err=""; render(); break;
    case "te-edit": readTEForm(); ui.ssheet[t.dataset.k]=""; render(); var f=document.getElementById("lk-"+t.dataset.k); if(f) f.focus(); break;
    case "te-remove": readTEForm(); ui.ssheet[t.dataset.k]=""; ui.ssheet["rm_"+t.dataset.k]=true; render(); break;
    case "tab": ui.tab=t.dataset.tab; ui.sheet=null; ui.msheet=null; ui.xsheet=null; ui.psheet=null; saveUI(); render(); window.scrollTo(0,0); break;
    case "addex": if(canWrite) openEx("expense"); break;
    case "settle": if(canWrite) openEx("settle"); break;
    case "editex": if(!canWrite) break; var ex=EX.find(function(x){return x.id===t.dataset.id;}); if(ex) openEx(ex.kind, ex); break;
    case "exset": readExForm(); ui.msheet[t.dataset.k]=t.dataset.v; ui.err=""; render(); break;
    case "delex":
      if(!ui.armed){ readExForm(); ui.armed=true; render(); break; }
      var xid=ui.msheet.id; EX=EX.filter(function(x){return x.id!==xid;}); ui.msheet=null; ui.armed=false; writeEx(xid,null); render(); break;
    case "type": readForm(); ui.sheet.type=t.dataset.type; render(); break;
    case "who": readForm(); ui.sheet.who=t.dataset.who; ui.err=""; render(); break;
    case "color": readForm(); ui.sheet.color=t.dataset.color||""; if(!ui.sheet.color) delete ui.sheet.color; render(); break;
    case "rep": readForm(); ui.sheet.repeat=t.dataset.rep||""; render(); break;
    case "delete":
      if(!ui.armed){ readForm(); ui.armed=true; render(); break; }
      var did=ui.sheet.id; S.items=S.items.filter(function(i){return i.id!==did;}); ui.sheet=null; write(did, null); render(); break;
    case "clear-ex": S.items.filter(function(i){return i.example;}).forEach(function(i){ write(i.id, null); }); S.items=S.items.filter(function(i){return !i.example;}); render(); break;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&ui.menu){ui.menu=false;render();return;}
  if(e.key==="Escape"&&(ui.sheet||ui.msheet||ui.ssheet||ui.xsheet||ui.psheet)){ui.sheet=null;ui.msheet=null;ui.ssheet=null;ui.xsheet=null;ui.psheet=null;render();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('.item[data-act="edit"],.item[data-act="editex"],.item[data-act="editexam"],.item[data-act="gostudy"]')){e.preventDefault();e.target.click();}
});
document.addEventListener("input",function(e){
  if(e.target.classList&&e.target.classList.contains("te-pick")){ var row=e.target.closest(".te-color"); if(row){ row.querySelector(".own-pick").style.setProperty("--pick",e.target.value); var pv=row.querySelector(".te-prev"); if(pv) pv.style.setProperty("--c",e.target.value); } return; }
  if(e.target.classList&&e.target.classList.contains("ev-pick")){ var op2=e.target.closest(".own-pick"); if(op2) op2.style.setProperty("--pick",e.target.value); return; }
  if(e.target.id==="bday-pick"){ applyBday(e.target.value); var op3=e.target.closest(".own-pick"); if(op3) op3.style.setProperty("--pick",e.target.value); return; }
  if(e.target.id==="accent-pick"){ applyAccent(e.target.value); userAccent=e.target.value; var hx=document.getElementById("accent-hex"); if(hx) hx.textContent=e.target.value.toUpperCase(); var op=e.target.closest(".own-pick"); if(op) op.style.setProperty("--pick",e.target.value); return; }
  if(e.target.id==="x-amt"&&ui.msheet){ ui.msheet.amountStr=e.target.value; var h=document.querySelector("#msheet .hint"); if(h) h.textContent=splitHint(ui.msheet); }
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="msheet"){ submitEx(); return; }
  if(e.target.id==="tesheet"){ saveTE(); return; }
  if(e.target.id==="xsheet"){ submitExam(); return; }
  if(e.target.id==="psheet"){ submitPrefs(); return; }
  readForm(); var it=ui.sheet;
  if(!it.who){ui.err="Kies voor wie het is: Ewoud, Helen of beiden."; render(); return;}
  if(!it.title){ui.err=it.type==="birthday"?"Vul de naam in.":"Geef eerst een titel op."; render(); return;}
  if(!it.date||it._dateRaw){ui.err="Vul de datum in als dd/mm/jjjj, bv. 29/01/2004."; render(); return;}
  if(it._timeErr){ui.err="Vul de tijd in als uu:mm, bv. 09:15 of 14:30."; render(); return;}
  if(it._untilRaw){ui.err="Vul de einddatum van de herhaling in als dd/mm/jjjj, of laat ze leeg."; render(); return;}
  delete it._untilRaw;
  delete it._dateRaw; delete it._timeErr;
  if(it.type==="event"&&it.start&&it.end&&it.end<it.start){ui.err="Het einde ligt voor het begin."; render(); return;}
  if(it.type==="task"){delete it.end; delete it.location;}
  if(it.repeat!=="weekly"){ delete it.repeat; delete it.until; delete it.doneDates; }
  else if(it.until && it.until<it.date){ ui.err="De herhaling moet na de begindatum eindigen."; render(); return; }
  if(it.type==="birthday"){ ["end","location","color","start","done","age"].forEach(function(k){ delete it[k]; }); it.yearKnown=it.yearKnown!==false; }
  delete it.example;
  if(!it.id){ it.id=uid(); if(userName) it.addedBy=userName; S.items.push(it); }
  else { if(userName) it.editedBy=userName; S.items=S.items.map(function(i){return i.id===it.id?it:i;}); }
  write(it.id, clean(it));
  if(it.type!=="birthday"){ ui.sel=it.date; ui.month=it.date.slice(0,7); } ui.sheet=null; ui.armed=false;
  if(ui.who!=="all" && it.who!==ui.who && it.who!=="both") ui.who="all";
  render();
});

render();
start();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden && authState==="in" && !ui.sheet && !ui.msheet && !ui.ssheet && !ui.xsheet && !ui.psheet){ ui._lastKey=null; ui._hKey=null; render(); }
  if(!document.hidden){ var t=iso(new Date()); if(t!==TODAY){ if(ui.sel===TODAY) ui.sel=t; TODAY=t; ui.month=ui.sel.slice(0,7); render(); } } });
})();
