name: Sync TimeEdit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin==6.5.0 icalendar==5.0.13
      - run: python scripts/sync_timeedit.py
        env:
          TIMEEDIT_URL: ${{ secrets.TIMEEDIT_URL }}
          TIMEEDIT_URL_HELEN: ${{ secrets.TIMEEDIT_URL_HELEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
